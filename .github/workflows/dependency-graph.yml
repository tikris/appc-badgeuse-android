name: Graphe des dépendances

# Envoie à GitHub la liste complète des dépendances Gradle (y compris indirectes), pour que
# Dependabot signale les vulnérabilités connues (Settings → Code security → Dependabot alerts).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/dependency-submission@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
